<dialog #dialogRef (close)="closeDialog.emit()" (click)="close()">
  <div class="project__dialog" (click)="$event.stopPropagation()">
    <div class="project__dialog__info">
      <span class="project__dialog__index">{{ selectedIndex() | number: '2.0-0' }}</span>
      <h3 class="project__dialog__title">{{ selectedProject()?.name }}</h3>
      <div class="project__dialog__text-block">
        <h4 class="project__dialog__subtitle">What is this Project about?</h4>
        <p class="project__dialog__description">{{ selectedProject()?.description }}</p>
        <ul class="techs">
          @for (tech of selectedProject()?.techs; track tech) {
            <li>
              <img [src]="techIcons[tech]" alt="" />
              <p>{{ tech }}</p>
            </li>
          }
        </ul>
      </div>
      <div class="buttons">
        <app-button
          label="GitHub"
          [href]="selectedProject()?.github ?? ''"
          [showIcon]="true"
        ></app-button>
        <app-button
          label="Live Test"
          [href]="selectedProject()?.demo ?? ''"
          [showIcon]="true"
        ></app-button>
      </div>
    </div>
    <div class="project__dialog__preview">
      <button (click)="close()">
        <svg
          width="18"
          height="18"
          viewBox="0 0 18 18"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M8.93957 10.3615L1.75507 17.546C1.54207 17.7587 1.30607 17.8587 1.04707 17.846C0.788067 17.833 0.552234 17.7202 0.339568 17.5075C0.126901 17.2948 0.0205673 17.0525 0.0205673 16.7805C0.0205673 16.5088 0.126901 16.2665 0.339568 16.0535L7.48557 8.9075L0.301068 1.773C0.0884014 1.56 -0.0115986 1.31767 0.00106805 1.046C0.014068 0.774336 0.126901 0.532 0.339568 0.319C0.552234 0.106334 0.794568 0 1.06657 0C1.33823 0 1.58057 0.106334 1.79357 0.319L8.93957 7.5035L16.0741 0.319C16.2871 0.106334 16.5231 0 16.7821 0C17.0411 0 17.2769 0.106334 17.4896 0.319C17.7102 0.539667 17.8206 0.783835 17.8206 1.0515C17.8206 1.3195 17.7102 1.56 17.4896 1.773L10.3436 8.9075L17.5281 16.092C17.7407 16.305 17.8471 16.541 17.8471 16.8C17.8471 17.059 17.7407 17.2948 17.5281 17.5075C17.3074 17.7282 17.0632 17.8385 16.7956 17.8385C16.5276 17.8385 16.2871 17.7282 16.0741 17.5075L8.93957 10.3615Z"
          />
        </svg>
      </button>
      <img [src]="selectedProject()?.img" alt="" />
      @if (selectedIndex() < totalProjects()) {
        <a (click)="nextProject.emit()"
          >Next Project
          <svg
            width="19"
            height="19"
            viewBox="0 0 19 19"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M16.105 9.74506H0.666667C0.476889 9.74506 0.318333 9.68139 0.191 9.55406C0.0636665 9.42673 0 9.26817 0 9.07839C0 8.88862 0.0636665 8.73006 0.191 8.60273C0.318333 8.47539 0.476889 8.41173 0.666667 8.41173H16.105L8.854 1.16039C8.724 1.03062 8.656 0.877615 8.65 0.701393C8.644 0.525393 8.71456 0.363838 8.86167 0.216727C9.00856 0.0749489 9.16578 0.00272669 9.33333 6.00198e-05C9.50089 -0.00238442 9.65811 0.0698378 9.805 0.216727L17.9127 8.32439C18.0291 8.44084 18.1108 8.55973 18.1577 8.68106C18.2048 8.80239 18.2283 8.93484 18.2283 9.07839C18.2283 9.22195 18.2048 9.35439 18.1577 9.47573C18.1108 9.59706 18.0291 9.71595 17.9127 9.83239L9.805 17.9401C9.68033 18.0647 9.52867 18.1314 9.35 18.1401C9.17133 18.1485 9.00856 18.0818 8.86167 17.9401C8.71456 17.7929 8.641 17.6344 8.641 17.4644C8.641 17.2942 8.71456 17.1356 8.86167 16.9887L16.105 9.74506Z"
              fill="#3DCFB6"
            />
          </svg>
        </a>
      }
    </div>
  </div>
</dialog>
